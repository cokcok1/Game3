</style></head><body><canvas id="game"></canvas><div class="hud"><strong>九龍街頭 <b>V0.82</b></strong><div id="loc">載入真實旺角街網中…</div><div id="coords"></div></div><div class="hint">右邊空白處拖動：360° 旋轉<br>雙指縮放 · 左邊搖桿行走<br>電腦：WASD／滑鼠拖動／滾輪</div><div class="joy" id="joy"><div class="nub" id="nub"></div></div><div class="actions"><button id="reset">⟳ 重設鏡頭</button><button id="plus">＋ 拉近</button><button id="minus">－ 拉遠</button></div><div class="status">3D 鏡頭測試版 · 道路及建築平面輪廓取自 OSM · 建築高度為模擬</div><div class="error" id="error"></div>
<script>
'use strict';
const canvas=document.getElementById('game'), gl=canvas.getContext('webgl',{antialias:true,alpha:false});
const err=s=>{let e=document.getElementById('error');e.style.display='block';e.textContent=s};

let program;if(gl){program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,V));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,F));gl.linkProgram(program);gl.useProgram(program);gl.enable(gl.DEPTH_TEST);gl.clearColor(.55,.68,.72,1)}
const posLoc=gl?gl.getAttribLocation(program,'p'):0,colLoc=gl?gl.getAttribLocation(program,'c'):0,mvpLoc=gl?gl.getUniformLocation(program,'mvp'):null;
const geo=[];function tri(a,b,c,color){for(let p of [a,b,c])geo.push(p[0],p[1],p[2],...color)}

function box(x,z,w,d,h,color){let a=[x-w/2,0,z-d/2],b=[x+w/2,0,z-d/2],c=[x+w/2,0,z+d/2],e=[x-w/2,0,z+d/2],A=[a[0],h,a[2]],B=[b[0],h,b[2]],C=[c[0],h,c[2]],D=[e[0],h,e[2]];quad(A,B,C,D,color);quad(a,b,B,A,color.map(v=>v*.74));quad(b,c,C,B,color.map(v=>v*.83));quad(c,e,D,C,color.map(v=>v*.64));quad(e,a,A,D,color.map(v=>v*.8))}
function roadSegment(a,b,w){let dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz);if(len<.05)return;let nx=-dz/len*w/2,nz=dx/len*w/2,y=.06;quad([a[0]+nx,y,a[1]+nz],[b[0]+nx,y,b[1]+nz],[b[0]-nx,y,b[1]-nz],[a[0]-nx,y,a[1]-nz],[.19,.23,.26]);if(w>=9){let y=.08,ww=.12;quad([a[0]-nx/w*ww,y,a[1]-nz/w*ww],[b[0]-nx/w*ww,y,b[1]-nz/w*ww],[b[0]+nx/w*ww,y,b[1]+nz/w*ww],[a[0]+nx/w*ww,y,a[1]+nz/w*ww],[.72,.66,.44])}}
let player={x:0,z:0,yaw:0},yaw=0,pitch=.38,dist=35,joy={x:0,y:0},keys={},loaded=false,buffer=null,count=0,roadList=[];
function upload(){if(!gl)return;buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(geo),gl.STATIC_DRAW);count=geo.length/6;geo.length=0}
function build(map){quad([-1500,-.1,-1500],[1500,-.1,-1500],[1500,-.1,1500],[-1500,-.1,1500],[.36,.42,.38]);let nearRoads=map.roads.filter(r=>r.p.some(p=>Math.abs(p[0])<360&&Math.abs(p[1])<360));roadList=nearRoads;for(let r of nearRoads){let w=({motorway:18,trunk:17,primary:14,secondary:11,tertiary:9,residential:7,service:5,footway:2,pedestrian:5})[r.k]||6;for(let i=1;i<r.p.length;i++){let a=r.p[i-1],b=r.p[i];if(Math.max(Math.abs(a[0]),Math.abs(a[1]),Math.abs(b[0]),Math.abs(b[1]))<440)roadSegment(a,b,w)}}
let n=0;for(let poly of map.buildings){if(!poly.length)continue;let minx=Infinity,maxx=-Infinity,minz=Infinity,maxz=-Infinity;for(let p of poly){minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);minz=Math.min(minz,p[1]);maxz=Math.max(maxz,p[1])}let x=(minx+maxx)/2,z=(minz+maxz)/2,w=maxx-minx,d=maxz-minz;if(Math.abs(x)>330||Math.abs(z)>330||w<2||d<2||w>95||d>95)continue;let h=12+((Math.abs(Math.floor(x*13+z*7))%11)*2.7),t=n++%5;let color=[[.64,.61,.54],[.52,.57,.61],[.71,.66,.58],[.54,.58,.55],[.62,.54,.49]][t];box(x,z,w,d,h,color)}
let start=nearRoads.find(r=>r.n==='彌敦道'&&r.p.some(p=>Math.abs(p[0])<140&&Math.abs(p[1])<140));if(!start)start=nearRoads.find(r=>r.p.some(p=>Math.abs(p[0])<80&&Math.abs(p[1])<80));if(start){let p=start.p.find(p=>Math.abs(p[0])<140&&Math.abs(p[1])<140)||start.p[0];player.x=p[0];player.z=p[1]}
upload();loaded=true;document.getElementById('loc').textContent='真實旺角 OSM 街道 · 第三身 3D';}
const mul=(a,b)=>{let o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];return o};
function perspective(fov,aspect,near,far){let f=1/Math.tan(fov/2);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0])}
function lookAt(eye,target){let z=eye.map((v,i)=>v-target[i]),l=Math.hypot(...z);z=z.map(v=>v/l);let x=[z[2],0,-z[0]],xl=Math.hypot(...x)||1;x=x.map(v=>v/xl);let y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-x.reduce((s,v,i)=>s+v*eye[i],0),-y.reduce((s,v,i)=>s+v*eye[i],0),-z.reduce((s,v,i)=>s+v*eye[i],0),1])}
function drawMesh(data,mvp){let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STREAM_DRAW);gl.vertexAttribPointer(posLoc,3,gl.FLOAT,false,24,0);gl.vertexAttribPointer(colLoc,3,gl.FLOAT,false,24,12);gl.uniformMatrix4fv(mvpLoc,false,mvp);gl.drawArrays(gl.TRIANGLES,0,data.length/6);gl.deleteBuffer(b)}
function render(time){requestAnimationFrame(render);if(!gl||!loaded)return;let dt=Math.min(.05,(time-(render.last||time))/1000);render.last=time;let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,1.5);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);gl.viewport(0,0,canvas.width,canvas.height)}
let dx=joy.x+(keys.d?1:0)-(keys.a?1:0),dy=-joy.y+(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0);let mag=Math.hypot(dx,dy);if(mag>.04){dx/=Math.max(1,mag);dy/=Math.max(1,mag);let vx=Math.cos(yaw)*dx+Math.sin(yaw)*dy,vz=-Math.sin(yaw)*dx+Math.cos(yaw)*dy;player.x+=vx*dt*5;player.z+=vz*dt*5;player.yaw=Math.atan2(vx,vz)}
let target=[player.x,1.65,player.z],cp=Math.cos(pitch);let eye=[player.x-Math.sin(yaw)*cp*dist,1.65+Math.sin(pitch)*dist,player.z-Math.cos(yaw)*cp*dist];let mvp=mul(perspective(Math.PI/3,w/h,.2,1800),lookAt(eye,target));gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);gl.enableVertexAttribArray(posLoc);gl.enableVertexAttribArray(colLoc);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.vertexAttribPointer(posLoc,3,gl.FLOAT,false,24,0);gl.vertexAttribPointer(colLoc,3,gl.FLOAT,false,24,12);gl.uniformMatrix4fv(mvpLoc,false,mvp);gl.drawArrays(gl.TRIANGLES,0,count);
let p=[];function t(a,b,c,col){for(let q of [a,b,c])p.push(...q,...col)}function q(a,b,c,d,col){t(a,b,c,col);t(a,c,d,col)}let x=player.x,z=player.z;let skin=[.85,.66,.49],shirt=[.13,.28,.34],pants=[.12,.16,.23];function cube(cx,cz,y,ww,dd,hh,color){let a=[cx-ww/2,y,cz-dd/2],b=[cx+ww/2,y,cz-dd/2],c=[cx+ww/2,y,cz+dd/2],d=[cx-ww/2,y,cz+dd/2],A=[a[0],y+hh,a[2]],B=[b[0],y+hh,b[2]],C=[c[0],y+hh,c[2]],D=[d[0],y+hh,d[2]];q(A,B,C,D,color);q(a,b,B,A,color);q(b,c,C,B,color.map(v=>v*.8));q(c,d,D,C,color.map(v=>v*.75));q(d,a,A,D,color)}cube(x,z,.75,.5,.29,.72,shirt);cube(x,z,1.47,.3,.3,.29,skin);cube(x-.14,z,0,.18,.22,.76,pants);cube(x+.14,z,0,.18,.22,.76,pants);cube(x-.36,z,.76,.16,.22,.65,skin);cube(x+.36,z,.76,.16,.22,.65,skin);drawMesh(p,mvp);document.getElementById('coords').textContent=`位置 ${Math.round(player.x)}, ${Math.round(player.z)} · 鏡頭 ${Math.round(dist)}m`}
requestAnimationFrame(render);
fetch('mongkok-map.json').then(r=>{if(!r.ok)throw Error('地圖資料載入失敗');return r.json()}).then(build).catch(e=>err('無法載入 mongkok-map.json。請透過 GitHub Pages 或本機伺服器開啟，而非直接雙擊 HTML。'+e.message));
const joyEl=document.getElementById('joy'),nub=document.getElementById('nub');let joyId=null;function joyMove(e){let r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,rad=r.width*.31;joy.x=clamp((e.clientX-cx)/rad,-1,1);joy.y=clamp((e.clientY-cy)/rad,-1,1);let m=Math.hypot(joy.x,joy.y);if(m>1){joy.x/=m;joy.y/=m}nub.style.transform=`translate(${joy.x*rad}px,${joy.y*rad}px)`}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});function joyEnd(e){if(e.pointerId===joyId){joyId=null;joy.x=joy.y=0;nub.style.transform=''}}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
let pointers=new Map(),lastPinch=0;canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);lastPinch=0});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();let old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){yaw-=(e.clientX-old[0])*.007;pitch=clamp(pitch+(e.clientY-old[1])*.005,.09,1.32)}else if(pointers.size===2){let a=[...pointers.values()],pd=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(lastPinch)dist=clamp(dist*lastPinch/Math.max(1,pd),6,130);lastPinch=pd}});function end(e){pointers.delete(e.pointerId);lastPinch=0}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist*Math.exp(e.deltaY*.001),6,130)},{passive:false});
