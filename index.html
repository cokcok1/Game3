'use strict';const canvas=document.querySelector('#game'),g=canvas.getContext('2d'),mini=document.querySelector('#mini'),mg=mini.getContext('2d');let W,H,dpr;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const $=id=>document.getElementById(id),keys=new Set(),joy={x:0,y:0,id:null};const joyEl=$('joy'),knob=$('knob');function joyMove(e){let r=joyEl.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=r.width*.33,l=Math.hypot(x,y);if(l>m){x*=m/l;y*=m/l}joy.x=x/m;joy.y=y/m;knob.style.transform=`translate(${x}px,${y}px)`}joyEl.onpointerdown=e=>{e.preventDefault();if(joy.id!==null)return;joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e)};joyEl.onpointermove=e=>{if(e.pointerId===joy.id){e.preventDefault();joyMove(e)}};function release(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;knob.style.transform=''}for(let e of ['pointerup','pointercancel','lostpointercapture'])joyEl.addEventListener(e,release);document.addEventListener('contextmenu',e=>{if(e.target.closest('button,#joy,canvas'))e.preventDefault()});function hold(el,key){el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);keys.add(key)};for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys.delete(key))}hold($('brake'),' ');let zoom=1;function scale(f){zoom=Math.max(.35,Math.min(1.6,zoom*f))}$('plus').onclick=()=>scale(1.2);$('minus').onclick=()=>scale(1/1.2);canvas.addEventListener('wheel',e=>{e.preventDefault();scale(e.deltaY<0?1.1:1/1.1)},{passive:false});let map,roads=[],buildings=[],roadSegments=[],traffic=[],walkers=[],goals=[],cam={x:0,y:0,ready:false},time=0,flash=0,noticeTimer=0;const p={x:0,y:0,angle:0,car:false,speed:0,cash:0,stage:0,heat:0,health:100};function notice(t){$('notice').textContent=t;$('notice').style.display='block';noticeTimer=2.5}function project(x,y,z=0){return{x:(x-y)*.76,y:(x+y)*.38-z}}function roadWidth(k){return ({motorway:30,trunk:26,primary:23,secondary:20,tertiary:16,residential:12,service:8,unclassified:11,living_street:9})[k]||10}function nearest(x,y){let best=null,d=Infinity;for(const s of roadSegments){const vx=s.b[0]-s.a[0],vy=s.b[1]-s.a[1],t=Math.max(0,Math.min(1,((x-s.a[0])*vx+(y-s.a[1])*vy)/(vx*vx+vy*vy||1))),px=s.a[0]+vx*t,py=s.a[1]+vy*t,dd=Math.hypot(x-px,y-py);if(dd<d){d=dd;best={x:px,y:py,s,dist:dd,t}}}return best}function polyPath(points){g.beginPath();for(let i=0;i<points.length;i++){let q=project(points[i][0],points[i][1]);if(i===0)g.moveTo(q.x,q.y);else g.lineTo(q.x,q.y)}g.closePath()}function buildingHit(x,y,r){for(const b of buildings){if(x+r<b.minx||x-r>b.maxx||y+r<b.miny||y-r>b.maxy)continue;let inside=false;for(let i=0,j=b.p.length-1;i<b.p.length;j=i++){const a=b.p[i],c=b.p[j];if((a[1]>y)!==(c[1]>y)&&x<(c[0]-a[0])*(y-a[1])/(c[1]-a[1]||1e-9)+a[0])inside=!inside}if(inside)return true}return false}function hitVehicle(x,y,r){for(const a of traffic){if(a.used)continue;if(Math.hypot(x-a.x,y-a.y)<r+(a.kind==='bus'?13:8))return true}return false}function blocked(x,y,r){return buildingHit(x,y,r)||hitVehicle(x,y,r)}function spawn(){const candidates=roadSegments.filter(s=>s.length>30&&s.name);const central=nearest(0,0);p.x=central?.x||0;p.y=central?.y||0;try{const s=JSON.parse(localStorage.getItem('kowloon-v08')||'null');if(s&&Number.isFinite(s.x)&&Math.abs(s.x)<3000&&Math.abs(s.y)<3000)Object.assign(p,s)}catch{}if(buildingHit(p.x,p.y,5)){p.x=central.x;p.y=central.y}for(let i=0;i<35;i++){const s=candidates[(i*137)%candidates.length],t=((i*37)%97)/100;let x=s.a[0]+(s.b[0]-s.a[0])*t,y=s.a[1]+(s.b[1]-s.a[1])*t,dx=(s.b[0]-s.a[0])/s.length,dy=(s.b[1]-s.a[1])/s.length;let side=i%2?1:-1;traffic.push({x:x-dy*3*side,y:y+dx*3*side,s,t,side,dir:side,kind:i%13===0?'bus':i%7===0?'minibus':i%3===0?'taxi':'car',v:7+i%6*2,used:false})}for(let i=0;i<75;i++){let s=candidates[(i*71+1 bus'){g.fillStyle='#3c9461';g.fillRect(-w/2,-l/2,w,4)}if(hero){g.strokeStyle='#ffe65c';g.lineWidth=2;g.strokeRect(-w/2-3,-l/2-3,w+6,l+6)}g.restore()}function personDraw(x,y,shirt,phase,hero=false){let a=project(x,y);g.save();g.translate(a.x,a.y);g.fillStyle='#283d46';g.beginPath();g.ellipse(0,2,5,2,0,0,7);g.fill();g.strokeStyle='#283d46';g.lineWidth=2;g.beginPath();g.moveTo(-2,-5);g.lineTo(-2+Math.sin(phase)*3,1);g.moveTo(2,-5);g.lineTo(2-Math.sin(phase)*3,1);g.stroke();g.fillStyle=shirt;g.fillRect(-4,-16,8,11);g.fillStyle='#e7b88e';g.beginPath();g.arc(0,-19,4,0,7);g.fill();if(hero){g.fillStyle='#fff';g.font='bold 12px system-ui';g.textAlign='center';g.fillText('你',0,-30);if(flash>0){g.strokeStyle='#ffe45c';g.lineWidth=3;g.beginPath();g.moveTo(5,-12);g.lineTo(17,-15);g.stroke()}}g.restore()}function buildDraw(b){const pts=b.p;if(pts.length<3)return;const z=b.z;let fade=Math.abs(p.x-b.cx)<b.radius+13&&Math.abs(p.y-b.cy)<b.radius+13&&b.cx+b.cy>p.x+p.y-50;g.save();g.globalAlpha=fade?.22:1;g.fillStyle=b.color;g.strokeStyle='#5b7475';g.lineWidth=.8;polyPath(pts);g.fill();g.stroke();for(let i=0;i<pts.length;i++){let a=pts[i],c=pts[(i+1)%pts.length],ap=project(...a),cp=project(...c),at=project(a[0],a[1],z),ct=project(c[0],c[1],z);g.beginPath();g.moveTo(ap.x,ap.y);g.lineTo(cp.x,cp.y);g.lineTo(ct.x,ct.y);g.lineTo(at.x,at.y);g.closePath();g.fillStyle=i%2?'#758b87':'#8e9a91';g.fill()}g.beginPath();pts.forEach((a,i)=>{let q=project(a[0],a[1],z);if(i)g.lineTo(q.x,q.y);else g.moveTo(q.x,q.y)});g.closePath();g.fillStyle=b.color;g.fill();g.strokeStyle='#f7f4e866';g.stroke();g.restore()}function update(dt){time+=dt;flash=Math.max(0,flash-dt);if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)$('notice').style.display='none'}let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));if(Math.hypot(joy.x,joy.y)>.08){dx=(joy.x/.76+joy.y/.38)*.5;dy=(joy.y/.38-joy.x/.76)*.5}let n=Math.hypot(dx,dy);if(n){dx/=n;dy/=n;p.angle=Math.atan2(dy,dx)+Math.PI/2}let speed=p.car?52:27;if(p.car){p.speed+=((keys.has(' ')?0:n?speed:0)-p.speed)*Math.min(1,dt*3);speed=p.speed}let nx=p.x+dx*speed*dt,ny=p.y+dy*speed*dt;if(!blocked(nx,p.y,p.car?6:3))p.x=nx;if(!blocked(p.x,ny,p.car?6:3))p.y=ny;p.heat=Math.max(0,p.heat-dt*.025);for(const a of traffic){if(a.used)continue;a.t+=dt*a.v/a.s.length*a.dir;if(a.t>1)a.t=0;if(a.t<0)a.t=1;let sx=(a.s.b[0]-a.s.a[0])/a.s.length,sy=(a.s.b[1]-a.s.a[1])/a.s.length;a.x=a.s.a[0]+a.t*(a.s.b[0]-a.s.a[0])-sy*3*a.side;a.y=a.s.a[1]+a.t*(a.s.b[1]-a.s.a[1])+sx*3*a.side}for(const a of walkers){a.phase+=dt*7;a.panic=Math.max(0,a.panic-dt);a.t+=dt*(a.panic?8:2.5)/a.s.length*a.dir;if(a.t>1||a.t<0){a.dir*=-1;a.t=Math.max(0,Math.min(1,a.t))}let sx=(a.s.b[0]-a.s.a[0])/a.s.length,sy=(a.s.b[1]-a.s.a[1])/a.s.length;a.x=a.s.a[0]+a.t*(a.s.b[0]-a.s.a[0])-sy*10*a.side;a.y=a.s.a[1]+a.t*(a.s.b[1]-a.s.a[1])+sx*10*a.side}let goal=goals[p.stage%3];if(Math.hypot(p.x-goal.x,p.y-goal.y)<16){p.stage++;if(p.stage%3===0){p.cash+=500;notice('速遞完成！獎勵 $500')}else notice('到站！下一個標記')}}function draw(){g.fillStyle='#95ad9d';g.fillRect(0,0,W,H);let look=project(p.x+Math.sin(p.angle)*(p.car?20:0),p.y-Math.cos(p.angle)*(p.car?20:0)),tx=W/2-look.x*zoom,ty=H/2-look.y*zoom;if(!cam.ready){cam.x=tx;cam.y=ty;cam.ready=true}else{cam.x+=(tx-cam.x)*.12;cam.y+=(ty-cam.y)*.12}g.save();g.translate(cam.x,cam.y);g.scale(zoom,zoom);let range=Math.max(W,H)/zoom*1.6;for(const r of roads){if(!r.p.some(q=>Math.abs(q[0]-p.x)<range&&Math.abs(q[1]-p.y)<range))continue;g.beginPath();r.p.forEach((q,i)=>{let s=project(...q);if(i)g.lineTo(s.x,s.y);else g.moveTo(s.x,s.y)});g.strokeStyle='#d6d1c1';g.lineWidth=roadWidth(r.k)+4;g.lineJoin='round';g.stroke();g.strokeStyle='#48565d';g.lineWidth=roadWidth(r.k);g.stroke();if(roadWidth(r.k)>=16){g.setLineDash([8,9]);g.strokeStyle='#e7d59b';g.lineWidth=.8;g.stroke();g.setLineDash([])}}let items=[];for(const b of buildings)if(Math.abs(b.c requestAnimationFrame(loop);fetch('./mongkok-map.json').then(r=>{if(!r.ok)throw Error('地圖讀取失敗');return r.json()}).then(data=>{map=data;roads=data.roads;for(const r of roads){for(let i=1;i<r.p.length;i++){let a=r.p[i-1],b=r.p[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);if(len>3)roadSegments.push({a,b,length:len,name:r.n,kind:r.k})}}buildings=data.buildings.map((points,i)=>{let p=points.length>2&&points[0][0]===points.at(-1)[0]&&points[0][1]===points.at(-1)[1]?points.slice(0,-1):points;let xs=p.map(a=>a[0]),ys=p.map(a=>a[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);return{p,minx,maxx,miny,maxy,cx:(minx+maxx)/2,cy:(miny+maxy)/2,radius:Math.max(maxx-minx,maxy-miny)/2,z:10+i%6*5,color:['#d5b08e','#a6b5a3','#d5c4a8','#9baeb7'][i%4]}}).filter(b=>b.maxx-b.minx<180&&b.maxy-b.miny<180);spawn()}).catch(e=>{console.error(e);$('place').textContent='地圖載入失敗';notice('請透過 GitHub Pages 開啟，勿直接用 file://')});
