</style></head><body><canvas id="game"></canvas><div class="panel" id="hud"><strong>九龍街頭 V0.2</strong><div id="location">旺角 · 步行</div><div id="street">附近街道</div><div id="money">現金 $0</div><div id="wanted">通緝 ☆☆☆☆☆</div></div><div class="panel" id="mission"><b>任務：街頭速遞</b><div id="objective">前往黃色標記接取任務</div><div id="progress"></div></div><canvas id="map" width="220" height="180"></canvas><div id="tip">WASD／方向鍵移動 · E 上落車 · 空白鍵煞車 · R 重設</div><div id="controls"><div class="pad"><button data-key="arrowup">▲</button><button data-key="arrowleft">◀</button><button data-key="arrowright">▶</button><button data-key="arrowdown">▼</button></div><div class="actions"><button id="brake">煞車</button><button id="enter">上落車 E</button></div></div><div id="banner"></div><script>

const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),mini=document.querySelector('#map'),mc=mini.getContext('2d');let W,H,dpr;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const world={w:2600,h:2300},xs=[160,400,640,880,1120,1360,1600,1840,2080,2320],ys=[170,410,650,890,1130,1370,1610,1850,2090],xn=['上海街','新填地街','彌敦道','西洋菜南街','通菜街','花園街','洗衣街','黑布街','窩打老道','聯運街'],yn=['太子道西','弼街','旺角道','亞皆老街','山東街','豉油街','登打士街','咸美頓街','文明里'];const buildings=[];for(let i=0;i<xs.length-1;i++)for(let j=0;j<ys.length-1;j++){buildings.push({x:xs[i]+48,y:ys[j]+48,w:xs[i+1]-xs[i]-96,h:ys[j+1]-ys[j]-96,t:(i*7+j*3)%5})}const colors=['#9c8f7a','#748c87','#a18d85','#7b8c9b','#a59d83'];const start={x:640,y:890};let player={x:start.x,y:start.y,inCar:false,angle:0,speed:0,money:0,wanted:0,stage:0,missions:0};try{const s=JSON.parse(localStorage.getItem('kowloon-v02')||'null');if(s&&Number.isFinite(s.x)&&Number.isFinite(s.y)&&s.x>0&&s.x<world.w&&s.y>0&&s.y<world.h)player={...player,...s}}catch{}const points=[{x:880,y:650},{x:1600,y:1370},{x:400,y:1850}];const keys=new Set();let bannerUntil=0;function notify(msg){const b=document.querySelector('#banner');b.textContent=msg;b.style.display='block';bannerUntil=performance.now()+2200}function toggle(){if(player.inCar){player.inCar=false;player.speed=0;notify('已落車')}else{player.inCar=true;player.speed=0;notify('已上車')}}document.querySelector('#enter').onclick=toggle;document.querySelector('#brake').addEventListener('pointerdown',e=>{e.preventDefault();keys.add(' ')});for(const event of ['pointerup','pointercancel','pointerleave'])document.querySelector('#brake').addEventListener(event,()=>keys.delete(' '));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(k))});addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k==='e'&&!e.repeat)toggle();if(k==='r'&&!e.repeat){player.x=start.x;playe ;if(a.y>world.h)a.y=0}else{a.x+=a.dir*a.v*dt;if(a.x<0)a.x=world.w;if(a.x>world.w)a.x=0}}for(const p of pedestrians){p.y+=p.dir*p.v*dt;if(p.y<40||p.y>world.h-40)p.dir*=-1}const goal=points[player.stage%points.length];if(Math.hypot(player.x-goal.x,player.y-goal.y)<48){player.stage++;if(player.stage%3===0){player.money+=500;player.missions++;notify('任務完成！獲得 $500')}else notify('已抵達！前往下一個標記')}}function draw(){ctx.fillStyle='#1c3938';ctx.fillRect(0,0,W,H);const camX=player.x-W/2,camY=player.y-H/2;ctx.save();ctx.translate(-camX,-camY);ctx.fillStyle='#668473';ctx.fillRect(0,0,world.w,world.h);ctx.fillStyle='#414c54';xs.forEach(x=>ctx.fillRect(x-43,0,86,world.h));ys.forEach(y=>ctx.fillRect(0,y-43,world.w,86));ctx.setLineDash([15,18]);ctx.strokeStyle='#dfd5a4';ctx.lineWidth=2;xs.forEach(x=>{ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()});ys.forEach(y=>{ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()});ctx.setLineDash([]);for(const b of buildings){if(b.x+b.w<camX-30||b.x>camX+W+30||b.y+b.h<camY-30||b.y>camY+H+30)continue;ctx.fillStyle='#b2b7ae';ctx.fillRect(b.x-7,b.y-7,b.w+14,b.h+14);ctx.fillStyle=colors[b.t];ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#d6c5aa';for(let x=b.x+16;x<b.x+b.w-10;x+=28)for(let y=b.y+16;y<b.y+b.h-10;y+=29)ctx.fillRect(x,y,10,7)}ctx.textAlign='center';ctx.fillStyle='#fff1c3';ctx.font='bold 16px system-ui';xs.forEach((x,i)=>ctx.fillText(xn[i],x,65));ys.forEach((y,i)=>ctx.fillText(yn[i],70,y-12));for(const a of traffic)car(a.x,a.y,a.vertical?(a.dir>0?Math.PI:0):(a.dir>0?Math.PI/2:-Math.PI/2),a.color);for(const p of pedestrians){ctx.fillStyle='#e9c69e';ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill()}const goal=points[player.stage%points.length];ctx.strokeStyle='#fbe15c';ctx.lineWidth=5;ctx.beginPath();ctx.arc(goal.x,goal.y,34+Math.sin(performance.now()/260)*4,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffe45c';ctx.font='bold 18px system-ui';ctx.fillText('任務',goal.x,goal.y-44);if(player.inCar)car(player.x,player.y,player.angle,'#e9c35a',true);else{ctx.fillStyle='#f5d1a6';ctx.beginPath();ctx.arc(player.x,player.y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#204ba3';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='white';ctx.fillText('你',player.x,player.y-21)}ctx.restore();let near='',dist=1e9;xs.forEach((x,i)=>{if(Math.abs(player.x-x)<dist){dist=Math.abs(player.x-x);near=xn[i]}});ys.forEach((y,i)=>{if(Math.abs(player.y-y)<dist){dist=Math.abs(player.y-y);near=yn[i]}});document.querySelector('#location').textContent='旺角示意區 · '+(player.inCar?'駕駛':'步行');document.querySelector('#street').textContent='附近：'+near;document.querySelector('#money').textContent='現金 $'+player.money+' · 完成 '+player.missions+' 次';document.querySelector('#wanted').textContent='通緝 ☆☆☆☆☆';document.querySelector('#objective').textContent=player.stage%3===0?'前往黃色標記接取速遞':'前往下一個黃色標記';document.querySelector('#progress').textContent='路線進度 '+(player.stage%3)+'/3 · '+Math.round(Math.hypot(player.x-goal.x,player.y-goal.y))+'m（遊戲單位）';mc.clearRect(0,0,220,180);mc.fillStyle='#547265';mc.fillRect(0,0,220,180);mc.fillStyle='#3e4c50';xs.forEach(x=>mc.fillRect(x/world.w*220-3,0,6,180));ys.forEach(y=>mc.fillRect(0,y/world.h*180-3,220,6));mc.fillStyle='#ffde56';mc.beginPath();mc.arc(goal.x/world.w*220,goal.y/world.h*180,5,0,7);mc.fill();mc.fillStyle='#ffffff';mc.beginPath();mc.arc(player.x/world.w*220,player.y/world.h*180,5,0,7);mc.fill()}let last=performance.now(),saveTime=0;function frame(t){const dt=Math.min(.045,(t-last)/1000);last=t;update(dt);draw();if(t>bannerUntil)document.querySelector('#banner').style.display='none';if(t-saveTime>2500){saveTime=t;try{localStorage.setItem('kowloon-v02',JSON.stringify(player))}catch{}}requestAnimationFrame(frame)}requestAnimationFrame(frame);
