<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#182735"><title>九龍街頭 — V0.1 原型</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#152532;color:white;font-family:system-ui,'Noto Sans TC',sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:12px;left:12px;background:#10212ddd;padding:12px;border-radius:12px;line-height:1.7;font-size:14px;pointer-events:none}#hud b{font-size:19px}#help{position:fixed;right:10px;top:10px;background:#10212ddd;border-radius:10px;padding:9px;font-size:12px;max-width:220px}#controls{position:fixed;bottom:18px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:3;grid-row:2}.pad button:nth-child(4){grid-column:2;grid-row:3}button{pointer-events:auto;background:#243e54db;border:1px solid #ffffff55;border-radius:14px;color:white;font-size:23px;touch-action:none}.action{width:80px;height:80px;font-size:16px;background:#cf7c26e8}@media(min-width:850px){#controls{opacity:.5}}</style></head><body><canvas id="game"></canvas><div id="hud"><b>九龍街頭 · V0.1</b><div id="status">旺角 · 步行中</div><div id="street">彌敦道附近</div><div id="speed"></div></div><div id="help">WASD／方向鍵移動 · E 上落車 · R 重設位置<br>手機：方向鍵＋上落車</div><div id="controls"><div class="pad"><button data-k="ArrowUp">▲</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button><button data-k="ArrowDown">▼</button></div><button class="action" id="enter">上落車</button></div><script>
'use strict';const c=document.getElementById('game'),g=c.getContext('2d');let W=0,H=0,DPR=1;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
// 此版本為旺角風格示意街網，並非實測或已匯入 OSM 的真實道路資料。
const roadsX=[180,420,660,900,1140,1380,1620,1860],roadsY=[180,410,640,870,1100,1330,1560];const world={w:2040,h:1750};const namesX=['上海街','新填地街','彌敦道','西洋菜南街','通菜街','花園街','洗衣街','聯運街'];const namesY=['太子道西','弼街','旺角道','亞皆老街','山東街','豉油街','登打士街'];const bw=roadsX[1]-roadsX[0]-94,bh=roadsY[1]-roadsY[0]-94;let buildings=[];for(let i=0;i<roadsX.length-1;i++)for(let j=0;j<roadsY.length-1;j++){const x=roadsX[i]+47,y=roadsY[j]+47;buildings.push({x,y,w:bw,h:bh,shade:(i+j)%4})}const palette=['#71858d','#8d887d','#a18e7b','#778b80'];let cars=[];for(let i=0;i<22;i++){const vertical=i%2===0;const index=i% (vertical?roadsX.length:roadsY.length);cars.push({x:vertical?roadsX[index]:90+(i*137)%1840,y:vertical?90+(i*153)%1580:roadsY[index],vertical,dir:i%3===0?-1:1,speed:40+(i*17)%35,color:['#e5b64e','#d8e1e7','#c85e55','#68a7b8'][i%4]})}let p={x:roadsX[2]+32,y:roadsY[3]+60,inCar:false,angle:0};try{const s=JSON.parse(localStorage.getItem('kowloon-v01')||'null');if(s&&Number.isFinite(s.x)&&Number.isFinite(s.y)){p.x=Math.max(0,Math.min(world.w,s.x));p.y=Math.max(0,Math.min(world.h,s.y));p.inCar=!!s.inCar;p.angle=s.angle||0}}catch{}const keys=new Set();addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='e'&&!e.repeat)toggle();if(e.key.toLowerCase()==='r'){p.x=roadsX[2]+32;p.y=roadsY[3]+60;p.inCar=false}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k.toLowerCase();b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});document.getElementById('enter').onclick=toggle;function toggle(){p.inCar=!p.inCar}function hit(x,y,r){if(x<r||y<r||x>world.w-r||y>world.h-r)return true;return buildings.some(b=>x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)}let last=performance.now(),saveAt=0;function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;let dx=0,dy=0;if(keys.has('arrowup')||keys.has('w'))dy--;if(keys.has('arrowdown')||keys.has('s'))dy++;if(keys.has('arrowleft')||keys.has('a'))dx--;if(keys.has('arrowright')||keys.has('d'))dx++;if(dx||dy){const n=Math.hypot(dx,dy);dx/=n;dy/=n;const v=p.inCar?230:125;const r=p.inCar?16:9;if(!hit(p.x+dx*v*dt,p.y,r))p.x+=dx*v*dt;if(!hit(p.x,p.y+dy*v*dt,r))p.y+=dy*v*dt;p.angle=Math.atan2(dy,dx)+Math.PI/2}for(const a of cars){if(a.vertical){a.y+=a.dir*a.speed*dt;if(a.y<0)a.y=world.h;if(a.y>world.h)a.y=0}else{a.x+=a.dir*a.speed*dt;if(a.x<0)a.x=world.w;if(a.x>world.w)a.x=0}}g.fillStyle='#2e5348';g.fillRect(0,0,W,H);const camX=p.x-W/2,camY=p.y-H/2;g.save();g.translate(-camX,-camY);g.fillStyle='#64816e';g.fillRect(0,0,world.w,world.h);g.fillStyle='#4a5054';for(const x of roadsX)g.fillRect(x-45,0,90,world.h);for(const y of roadsY)g.fillRect(0,y-45,world.w,90);g.strokeStyle='#d8d2aa';g.lineWidth=2;g.setLineDash([18,18]);for(const x of roadsX){g.beginPath();g.moveTo(x,0);g.lineTo(x,world.h);g.stroke()}for(const y of roadsY){g.beginPath();g.moveTo(0,y);g.lineTo(world.w,y);g.stroke()}g.setLineDash([]);for(const b of buildings){g.fillStyle='#a5a8a1';g.fillRect(b.x-7,b.y-7,b.w+14,b.h+14);g.fillStyle=palette[b.shade];g.fillRect(b.x,b.y,b.w,b.h);g.fillStyle='#c6bba3';for(let i=15;i<b.w-10;i+=28)for(let j=12;j<b.h-10;j+=30)g.fillRect(b.x+i,b.y+j,12,8)}g.font='bold 18px sans-serif';g.textAlign='center';g.fillStyle='#f4e8b9';roadsX.forEach((x,i)=>g.fillText(namesX[i],x,58));roadsY.forEach((y,i)=>g.fillText(namesY[i],65,y-12));g.font='bold 26px sans-serif';g.fillStyle='#f8f1dd';g.fillText('旺角 · MONG KOK',920,780);function drawCar(x,y,angle,color,hero){g.save();g.translate(x,y);g.rotate(angle);g.fillStyle='#152b32';g.fillRect(-13,-25,26,50);g.fillStyle=color;g.fillRect(-12,-22,24,44);g.fillStyle='#9ed0d8';g.fillRect(-10,-11,20,11);g.fillStyle='#d6e5e7';g.fillRect(-10,10,20,6);if(hero){g.strokeStyle='#ffea78';g.lineWidth=3;g.strokeRect(-15,-25,30,50)}g.restore()}for(const a of cars)drawCar(a.x,a.y,a.vertical?(a.dir>0?Math.PI:0):(a.dir>0?Math.PI/2:-Math.PI/2),a.color,false);if(p.inCar)drawCar(p.x,p.y,p.angle,'#edc65c',true);else{g.fillStyle='#f4d5b0';g.beginPath();g.arc(p.x,p.y,10,0,Math.PI*2);g.fill();g.strokeStyle='#173f9b';g.lineWidth=5;g.stroke();g.fillStyle='#fff';g.font='bold 14px sans-serif';g.fillText('你',p.x,p.y-20)}g.restore();let nearest='';let dist=Infinity;roadsX.forEach((x,i)=>{const d=Math.abs(p.x-x);if(d<dist){dist=d;nearest=namesX[i]}});roadsY.forEach((y,i)=>{const d=Math.abs(p.y-y);if(d<dist){dist=d;nearest=namesY[i]}});document.getElementById('status').textContent='旺角 · '+(p.inCar?'駕駛中':'步行中');document.getElementById('street').textContent='附近街道：'+nearest;document.getElementById('speed').textContent='位置：'+Math.round(p.x)+' / '+Math.round(p.y);if(now-saveAt>2500){saveAt=now;try{localStorage.setItem('kowloon-v01',JSON.stringify(p))}catch{}}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
